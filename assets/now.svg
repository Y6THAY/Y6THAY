<svg viewBox="0 0 1000 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Now: Computer Science student, cybersecurity &amp; systems architecture, going all in on the cybersecurity iceberg">
  <style>
    :root { 
      --bone: #000000; 
