<svg viewBox="0 0 720 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry: language distribution, shipping velocity 2024 to 2026">
  <style>
    :root { 
      --bone: #FFFFFF; 
      --rule: #FFFFFF; 
      --muted: #FFFFFF; 
      --dim: #FFFFFF; 
      --accent: #FFFFFF; 
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1{transform-origin:48px 0;animation-delay:.3s}.g2{transform-origin:48px 0;animation-delay:.45s}.g3{transform-origin:48px 0;animation-delay:.6s}
    .g4{transform-origin:48px 0;animation-delay:.75s}
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1.0s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}.d4{animation-delay:1.9s}.d5{animation-delay:2.2s}.d6{animation-delay:2.5s}
    @keyframes fade { to { opacity: 1; } }
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 572px 112px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .bar,.spark,.dot,.ping { animation: none; }
      .bar{transform:scaleX(1)} .spark{stroke-dashoffset:0} .dot{opacity:1} .ping{opacity:0}
    }
  </style>

  <line x1="48" y1="40" x2="672" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">TELEMETRY — WHAT THE HANDS ARE DOING</text>
  <text fill="var(--muted)" class="mono" x="672" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 02</text>
  <line x1="360" y1="64" x2="360" y2="296" stroke="var(--rule)" opacity=".4"/>

  <!-- language bars -->
  <text fill="var(--dim)" class="mono" x="48" y="78" font-size="10" letter-spacing="2.5">LANGUAGE DISTRIBUTION · EST.</text>
  <g class="mono" font-size="11">
    <text fill="var(--bone)" x="48" y="112">python</text>     <rect class="bar g1" x="48" y="120" width="220" height="6" fill="var(--accent)"/><text fill="var(--muted)" x="278" y="127" font-size="10">45%</text>
    <text fill="var(--bone)" x="48" y="152">java</text>       <rect class="bar g2" x="48" y="160" width="120" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="178" y="167" font-size="10">25%</text>
    <text fill="var(--bone)" x="48" y="192">bash</text>       <rect class="bar g3" x="48" y="200" width="75"  height="6" fill="var(--bone)"/><text fill="var(--muted)" x="133" y="207" font-size="10">15%</text>
    <text fill="var(--bone)" x="48" y="232">html · css</text> <rect class="bar g4" x="48" y="240" width="70"  height="6" fill="var(--bone)"/><text fill="var(--muted)" x="128" y="247" font-size="10">15%</text>
  </g>

  <!-- shipping velocity -->
  <text fill="var(--dim)" class="mono" x="392" y="78" font-size="10" letter-spacing="2.5">SHIPPING VELOCITY · 2024 → 2026</text>
  <g>
    <line x1="392" y1="252" x2="632" y2="252" stroke="var(--rule)"/>
    <polyline class="spark" points="392,240 430,232 468,210 506,188 544,148 572,112 602,92" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
    <circle class="dot d1" cx="430" cy="232" r="2.5" fill="var(--bone)"/>
    <circle class="dot d2" cx="468" cy="210" r="2.5" fill="var(--bone)"/>
    <circle class="dot d3" cx="506" cy="188" r="2.5" fill="var(--bone)"/>
    <circle class="dot d4" cx="544" cy="148" r="2.5" fill="var(--bone)"/>
    <circle class="ping" cx="572" cy="112" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="dot d5" cx="572" cy="112" r="3" fill="var(--accent)"/>
    <text fill="var(--dim)" class="mono" x="392" y="272" font-size="9.5" letter-spacing="1.5">'24</text>
    <text fill="var(--dim)" class="mono" x="486" y="272" font-size="9.5" letter-spacing="1.5">'25</text>
    <text fill="var(--dim)" class="mono" x="592" y="272" font-size="9.5" letter-spacing="1.5">'26</text>
    <text fill="var(--muted)" class="mono dot d6" x="392" y="300" font-size="10" letter-spacing="1.5">trend — <tspan fill="var(--accent)">accelerating</tspan></text>
  </g>
</svg>
