<svg viewBox="0 0 1000 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 02 — SYSTEM MAP">
  <style>
    :root {
      /* All ink colors are forced to white for this specific version */
      --rule: #FFFFFF;
      --muted: #FFFFFF;
      --accent: #FFFFFF;
      --ghost: #FFFFFF;
      /* Define other forced variables, but set them to white as well for consistency */
      --bone: #FFFFFF;
      --dim: #FFFFFF;
      /* Background variables if used internally, can keep as white, but graphics are white now */
      --node-bg: #FFFFFF;
      --core-bg: #FFFFFF;
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.3s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    .tick { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      .draw,.f,.tick { animation: none; } .draw { stroke-dashoffset: 0; } .f { opacity: 1; }
    }
  </style>
  <g class="f">
    <text class="mono" x="48" y="68" font-size="52" fill="var(--ghost)">02</text>
    <text class="mono tick" x="128" y="58" font-size="14" fill="var(--accent)" letter-spacing="6">SYSTEM MAP</text>
    <text class="mono" x="952" y="58" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/02-ecosystem</text>
  </g>
  <line class="draw" x1="308" y1="53" x2="807" y2="53"/>
</svg>
